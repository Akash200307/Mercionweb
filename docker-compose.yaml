# Production-style deployment for Mercionweb.
#
#   1. Copy the env template and fill in real values:
#        cp .env.production.example .env
#   2. Build and start:
#        docker compose up -d --build
#   3. Open http://localhost:${WEB_PORT:-8080}
#
# The API is intentionally NOT published to the host; it is reachable only
# through the nginx reverse proxy at /api, keeping a single public origin.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: mercion-api:latest
    restart: unless-stopped
    init: true
    env_file:
      # Optional so the stack still builds where env is injected another way
      # (e.g. Coolify sets service env directly). Required vars must still be
      # provided at runtime or the API will exit on boot.
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      # Persist the file-based user store across container recreations.
      - mercion-data:/app/server/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mercion

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Public, client-side values baked into the SPA at build time.
        # Leave VITE_API_URL empty so the browser uses same-origin /api (proxied by nginx).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
        VITE_WHMCS_URL: ${VITE_WHMCS_URL:-}
        VITE_WHMCS_PID_STARTER: ${VITE_WHMCS_PID_STARTER:-}
        VITE_WHMCS_PID_PRO: ${VITE_WHMCS_PID_PRO:-}
        VITE_WHMCS_PID_BUSINESS: ${VITE_WHMCS_PID_BUSINESS:-}
        VITE_WHMCS_PID_WP_STARTER: ${VITE_WHMCS_PID_WP_STARTER:-}
        VITE_WHMCS_PID_WP_PRO: ${VITE_WHMCS_PID_WP_PRO:-}
        VITE_WHMCS_PID_WP_BUSINESS: ${VITE_WHMCS_PID_WP_BUSINESS:-}
        VITE_SUPPORT_PHONE: ${VITE_SUPPORT_PHONE:-}
    image: mercion-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    # No host port is published here so reverse-proxy platforms (e.g. Coolify's
    # Traefik) can route a domain to this container without host-port conflicts.
    # For direct local access, docker-compose.override.yml publishes a host port.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mercion

volumes:
  mercion-data:

networks:
  mercion:
    driver: bridge
